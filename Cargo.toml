[package]
name = "pipeshare"
version = "0.5.0"
edition = "2024"
description = "Seamless, event-driven application audio routing for Linux/Wayland screen sharing sessions"
license = "MIT"
authors = ["Savas Tanriverdi <savastnr@duck.com>"]
repository = "https://github.com/SavasTanriverdi/PipeShare"
homepage = "https://github.com/SavasTanriverdi/PipeShare"
readme = "README.md"
keywords = ["pipewire", "wayland", "audio", "screencast", "linux"]
categories = ["multimedia::audio", "os::linux-apis", "command-line-utilities"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# D-Bus communication (XDG Portal monitoring)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization (for config/state)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
